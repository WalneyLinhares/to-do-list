<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>LISTA DE TAREFAS</h1>
        </div>

        <form class="form">
            <label>
                <input class="input-tarefa" id="input-tarefa" type="text" name="tarefa" placeholder="Escreva uma tarefa aqui...">
            </label>

            <input class="btn-add-tarefa" id="btn-add" type="button" value="Adicionar">
        </form>

        <ul class="container-tarefas" id="container-tarefas"></ul>

        <div class="contador-tarefas">
            <p>Tarefas concluídas: <span id="tarefas-concluidas"></span>/<span id="tarefas-total"></span></p>
        </div>
    </div>
</body>
<script src="script/script.js"></script>
</html>
